services:
  frontend:
    build:
      context: ./nextjs-web
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Swann OTT}
    image: swann-frontend:prod
    container_name: swann-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000/api}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    networks:
      - ott-net
    depends_on:
      - backend

  backend:
    build:
      context: ./swann-laravel-web
      dockerfile: Dockerfile
    image: swann-backend:prod
    container_name: swann-backend
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      APP_KEY: ${APP_KEY:-base64:eOBE3Er2LEKZXYIYsvdDITgCkheE7RBU+nDRQMQTpLA=}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-swann}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: "${DB_PASSWORD:-}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      MEILISEARCH_HOST: http://meilisearch:7700
    volumes:
      # In production, only persist storage/app/public for uploaded media
      - ./swann-laravel-web/storage/app/public:/var/www/html/storage/app/public
    networks:
      - ott-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./go-worker
      dockerfile: Dockerfile
    image: swann-worker:prod
    container_name: swann-worker
    restart: always
    environment:
      APP_ENV: ${APP_ENV:-production}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      DB_DSN: ${DB_USERNAME:-root}:${DB_PASSWORD:-}@tcp(mysql:3306)/${DB_DATABASE:-swann}?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /var/www/html/public/storage
    volumes:
      - ./swann-laravel-web/storage/app/public:/var/www/html/public/storage
    networks:
      - ott-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: swann-rabbitmq
    restart: always
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - ott-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  mysql:
    image: mysql/mysql-server:8.0
    container_name: swann-mysql
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_DATABASE:-swann}
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ott-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --password=$${MYSQL_ROOT_PASSWORD} --silent || mysqladmin ping -h localhost -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: swann-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ott-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: swann-meilisearch
    restart: always
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilisearch-data:/data.ms
    networks:
      - ott-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  ott-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  meilisearch-data:
    driver: local
