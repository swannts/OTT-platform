services:
  laravel.test:
    build:
      context: .
      dockerfile: Dockerfile
    image: swann-laravel:dev
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8000}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-swann}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILISEARCH_HOST: http://meilisearch:7700
    volumes:
      - .:/var/www/html
      - laravel-vendor:/var/www/html/vendor
    networks:
      - sail
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  mysql:
    image: mysql/mysql-server:8.0
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE:-swann}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - sail-mysql:/var/lib/mysql
    networks:
      - sail
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --silent"]
      retries: 10
      timeout: 5s
      interval: 5s
      start_period: 30s

  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - sail-redis:/data
    networks:
      - sail
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 10
      timeout: 5s
      interval: 5s

  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "127.0.0.1:${FORWARD_MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - sail-meilisearch:/data.ms
    networks:
      - sail
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      retries: 10
      timeout: 5s
      interval: 5s
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:${FORWARD_MAILHOG_PORT:-1025}:1025"
      - "127.0.0.1:${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025"
    networks:
      - sail

  selenium:
    image: selenium/standalone-chrome
    profiles:
      - browser-test
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - sail

networks:
  sail:
    driver: bridge

volumes:
  laravel-vendor:
  sail-mysql:
    driver: local
  sail-redis:
    driver: local
  sail-meilisearch:
    driver: local
