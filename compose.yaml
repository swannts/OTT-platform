name: ott-dev

services:
  admin:
    build:
      context: ./apps/admin
      dockerfile: docker/Dockerfile.dev
    image: ott-admin:dev
    init: true
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3032}:3032"
    environment:
      NODE_ENV: development
      LARAVEL_API_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/admin:/app
      - admin-node-modules:/app/node_modules
      - admin-next-cache:/app/.next
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: docker/Dockerfile.dev
      target: development
    image: ott-web:dev
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
      INTERNAL_API_URL: http://api:8000/api
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile.dev
    image: ott-api:dev
    init: true
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:eOBE3Er2LEKZXYIYsvdDITgCkheE7RBU+nDRQMQTpLA=}
      APP_URL: http://localhost:${BACKEND_PORT:-8000}
      ADMIN_UI_URL: http://localhost:${ADMIN_PORT:-3032}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      GO_WORKER_HEALTH_URL: http://worker:8081/health
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-swann}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-swann-local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: database
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-swann}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-swann-local}
      MEILISEARCH_HOST: http://meilisearch:7700
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,localhost:3032,127.0.0.1:3000,127.0.0.1:3032
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3032
    volumes:
      - ./apps/api:/var/www/html
      - backend-vendor:/var/www/html/vendor
      - ./apps/api/storage/app/public:/var/www/html/storage/app/public
      - ./apps/api/storage/app/private:/var/www/html/storage/app/private
      - backend-bootstrap-cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./apps/worker
      dockerfile: docker/Dockerfile.dev
    image: ott-worker:dev
    init: true
    expose:
      - "8081"
    environment:
      APP_ENV: development
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-swann}:${RABBITMQ_PASSWORD:-swann-local}@rabbitmq:5672/
      DB_DSN: ${DB_USERNAME:-root}:${DB_PASSWORD:-swann-local}@tcp(mysql:3306)/${DB_DATABASE:-swann}?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /var/www/html/public/storage
      PRIVATE_STORAGE_PATH: /var/www/html/storage/app/private
    volumes:
      - ./apps/worker:/app
      - go-worker-modules:/go/pkg/mod
      - ./apps/api/storage/app/public:/var/www/html/public/storage
      - ./apps/api/storage/app/private:/var/www/html/storage/app/private
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mysql:
    image: mysql/mysql-server:8.0
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_DATABASE:-swann}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-swann-local}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_FORWARD_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swann}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-swann-local}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "127.0.0.1:${MEILISEARCH_FORWARD_PORT:-7700}:7700"
    environment:
      MEILI_ENV: development
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  admin-node-modules:
    name: swann-ott-local_admin-node-modules
  admin-next-cache:
    name: swann-ott-local_admin-next-cache
  frontend-node-modules:
    name: swann-ott-local_frontend-node-modules
  frontend-next-cache:
    name: swann-ott-local_frontend-next-cache
  backend-vendor:
    name: swann-ott-local_backend-vendor
  backend-bootstrap-cache:
    name: swann-ott-local_backend-bootstrap-cache
  go-worker-modules:
    name: swann-ott-local_go-worker-modules
  mysql-data:
    name: swann-ott-local_mysql-data
  redis-data:
    name: swann-ott-local_redis-data
  rabbitmq-data:
    name: swann-ott-local_rabbitmq-data
  meilisearch-data:
    name: swann-ott-local_meilisearch-data
